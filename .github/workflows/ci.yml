# 위치: .github/workflows/ci.yml
# dev, main 으로 PR 을 올리거나 push 하면 빌드 + 테스트를 돌립니다.
# 테스트가 DB(Flyway)에 연결하기 때문에 MySQL 을 같이 띄웁니다.
name: CI

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: team28
          MYSQL_USER: team28
          MYSQL_PASSWORD: team28pw
          MYSQL_ROOT_PASSWORD: root1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & Test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: local
          MYSQL_DATABASE: team28
          MYSQL_USER: team28
          MYSQL_PASSWORD: team28pw
          # AI 서버 (테스트용 더미값. 실제 값은 Secrets)
          AI_ENABLED: "false"
          AI_BASE_URL: http://localhost:8000
          AI_INTERNAL_KEY: dummy-key
