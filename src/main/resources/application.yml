spring:
  application:
    name: team28-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway 가 만들고, JPA 는 검사만
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    enabled: ${AI_ENABLED:true}           # false 면 AI 서버 없이 임시 문장 (로컬 개발용)
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-key: ${AI_INTERNAL_KEY:}     # AI 서버의 AI_INTERNAL_KEY 와 같은 값
    connect-timeout: 2s
    read-timeout: 12s
