# 로컬 개발용 (docker-compose 의 MySQL 에 연결)
# 기본값이 들어 있어서 IntelliJ 에 환경변수를 따로 등록하지 않아도 실행됩니다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:team28}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:team28}
    password: ${MYSQL_PASSWORD:team28pw}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
