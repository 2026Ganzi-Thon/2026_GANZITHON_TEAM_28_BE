# 배포용 (EC2). 값은 전부 EC2 의 .env 에서 주입합니다. 여기에 실제 값을 쓰지 마세요.
# RDS MySQL 8.4 는 암호화 연결을 요구할 수 있어 sslMode=REQUIRED 로 접속합니다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:team28}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sslMode=REQUIRED
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
